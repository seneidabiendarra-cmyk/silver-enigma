<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSR User Profile Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root {
  --teal: #D0021B;
  --teal-light: #FDEDEF;
  --teal-dark: #8B0012;
  --blue: #378ADD;
  --blue-light: #E6F1FB;
  --blue-dark: #0C447C;
  --amber: #EF9F27;
  --amber-light: #FAEEDA;
  --amber-dark: #633806;
  --green: #639922;
  --green-light: #EAF3DE;
  --green-dark: #27500A;
  --coral: #D85A30;
  --coral-light: #FAECE7;
  --coral-dark: #4A1B0C;
  --bg: #F5F2ED;
  --surface: #FFFFFF;
  --text: #1A1A18;
  --muted: #6B6B65;
  --border: rgba(0,0,0,0.1);
  --yellow: #F5C800;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Barlow', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ── BACKGROUND TEXTURE ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(circle at 15% 50%, rgba(208,2,27,0.05) 0%, transparent 50%),
    radial-gradient(circle at 85% 20%, rgba(55,138,221,0.04) 0%, transparent 40%);
  pointer-events: none;
  z-index: 0;
}

.page { position: relative; z-index: 1; }

/* ── SCREENS ── */
.screen { display: none; min-height: 100vh; }
.screen.active { display: flex; flex-direction: column; }

/* ── HEADER BAR ── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 32px;
  border-bottom: 1px solid var(--border);
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(8px);
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-badge {
  background: var(--yellow);
  color: #000;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800;
  font-size: 18px;
  letter-spacing: 0.04em;
  padding: 4px 12px;
  line-height: 1;
}

.logo-text {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.08em;
  color: var(--muted);
  text-transform: uppercase;
}

.progress-wrap {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  color: var(--muted);
}

.progress-track {
  width: 140px;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--teal);
  border-radius: 2px;
  transition: width 0.4s ease;
}

/* ── WELCOME SCREEN ── */
#screen-welcome {
  justify-content: center;
  align-items: center;
  padding: 60px 24px;
  text-align: center;
}

.welcome-inner {
  max-width: 560px;
}

.welcome-eyebrow {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--teal);
  margin-bottom: 20px;
}

.welcome-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: clamp(42px, 8vw, 72px);
  font-weight: 800;
  line-height: 0.95;
  letter-spacing: -0.01em;
  margin-bottom: 20px;
  text-transform: uppercase;
}

.welcome-title span {
  color: var(--teal);
}

.welcome-desc {
  font-size: 16px;
  line-height: 1.65;
  color: var(--muted);
  margin-bottom: 40px;
}

.name-field-wrap {
  margin-bottom: 32px;
  text-align: left;
}

.name-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}

.name-input {
  width: 100%;
  padding: 14px 18px;
  font-family: 'Barlow', sans-serif;
  font-size: 17px;
  font-weight: 400;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}

.name-input:focus {
  border-color: var(--teal);
}

.name-input::placeholder {
  color: #BBBAB4;
}

.btn-start {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: var(--teal);
  color: #fff;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 16px 36px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
  width: 100%;
  justify-content: center;
}

.btn-start:hover { background: #A80015; }
.btn-start:active { transform: scale(0.99); }
.btn-start:disabled { background: #C8C8C2; cursor: default; }

.welcome-meta {
  margin-top: 24px;
  font-size: 13px;
  color: var(--muted);
}

/* ── QUIZ SCREEN ── */
#screen-quiz {
  flex-direction: column;
  padding-bottom: 60px;
}

.quiz-body {
  flex: 1;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 48px 24px;
}

.question-wrap {
  max-width: 640px;
  width: 100%;
}

.q-number {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--teal);
  margin-bottom: 14px;
}

.q-text {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: clamp(22px, 4vw, 32px);
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -0.01em;
  margin-bottom: 28px;
  color: var(--text);
}

.options-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.opt {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 16px 20px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 4px;
  cursor: pointer;
  transition: border-color 0.18s, background 0.18s;
  text-align: left;
  font-family: 'Barlow', sans-serif;
  font-size: 15px;
  line-height: 1.5;
  color: var(--text);
  width: 100%;
}

.opt:hover {
  border-color: var(--teal);
  background: #FAFAF8;
}

.opt.selected {
  border-color: var(--teal);
  background: var(--teal-light);
  color: var(--teal-dark);
}

.opt-letter {
  flex-shrink: 0;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--bg);
  border: 1.5px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.04em;
  transition: background 0.18s, border-color 0.18s, color 0.18s;
  margin-top: 1px;
}

.opt.selected .opt-letter {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}

.quiz-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 32px;
  background: rgba(255,255,255,0.8);
  backdrop-filter: blur(8px);
  border-top: 1px solid var(--border);
  position: sticky;
  bottom: 0;
}

.btn-nav {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 24px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.18s, opacity 0.18s;
  border: 1.5px solid var(--border);
  background: transparent;
  color: var(--text);
}

.btn-nav:hover { background: rgba(0,0,0,0.04); }
.btn-nav:disabled { opacity: 0.3; cursor: default; }
.btn-nav.primary {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}
.btn-nav.primary:hover { background: #A80015; }
.btn-nav.primary:disabled { background: #C8C8C2; border-color: #C8C8C2; }

/* ── RESULT SCREEN ── */
#screen-result {
  flex-direction: column;
}

.result-body {
  flex: 1;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 48px 24px;
}

.result-card {
  max-width: 680px;
  width: 100%;
}

.result-hero {
  margin-bottom: 32px;
}

.result-eyebrow {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.result-name-line {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: clamp(14px, 3vw, 18px);
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
}

.result-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: clamp(48px, 9vw, 80px);
  font-weight: 800;
  line-height: 0.9;
  letter-spacing: -0.02em;
  text-transform: uppercase;
  margin-bottom: 16px;
}

.result-subtitle-tag {
  display: inline-block;
  padding: 5px 14px;
  border-radius: 2px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 20px;
}

.result-divider {
  height: 2px;
  background: var(--border);
  margin-bottom: 24px;
  position: relative;
  overflow: visible;
}

.result-divider::after {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  width: 80px;
}

.result-desc {
  font-size: 16px;
  line-height: 1.7;
  color: var(--muted);
  margin-bottom: 32px;
  padding-left: 16px;
  border-left: 3px solid;
}

.traits-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 10px;
  margin-bottom: 32px;
}

@media (max-width: 500px) {
  .traits-grid { grid-template-columns: repeat(2, 1fr); }
}

.trait-block {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 12px 14px;
}

.trait-key {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 4px;
}

.trait-val {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  line-height: 1.4;
}

.score-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 20px;
  margin-bottom: 28px;
}

.score-heading {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 16px;
}

.score-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
}
.score-row:last-child { margin-bottom: 0; }

.score-lbl {
  font-size: 13px;
  color: var(--muted);
  width: 170px;
  flex-shrink: 0;
}

.score-track {
  flex: 1;
  height: 7px;
  background: var(--bg);
  border-radius: 99px;
  overflow: hidden;
}

.score-fill {
  height: 100%;
  border-radius: 99px;
  transition: width 0.8s cubic-bezier(0.23,1,0.32,1);
}

.score-pct {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  width: 34px;
  text-align: right;
}

/* snapshot section */
.snapshot-wrap {
  border: 1.5px dashed var(--border);
  border-radius: 4px;
  padding: 20px;
  margin-bottom: 24px;
  position: relative;
}

.snapshot-label {
  position: absolute;
  top: -10px;
  left: 16px;
  background: var(--bg);
  padding: 0 8px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}

.result-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.btn-action {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 13px 24px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.18s;
  border: 1.5px solid var(--border);
  background: transparent;
  color: var(--text);
}

.btn-action:hover { background: rgba(0,0,0,0.05); }

.btn-action.primary {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}
.btn-action.primary:hover { background: #A80015; }

/* print snapshot styles */
#snapshot-box {
  background: #fff;
  border: 1px solid #e0e0da;
  border-radius: 4px;
  padding: 20px;
  font-family: 'Barlow', sans-serif;
}

.snap-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid #e0e0da;
}

.snap-logo {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800;
  font-size: 22px;
  letter-spacing: 0.04em;
}

.snap-logo span {
  background: var(--yellow);
  padding: 2px 8px;
  margin-right: 6px;
}

.snap-meta { font-size: 12px; color: #888; }

.snap-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #888;
  margin-bottom: 4px;
}

.snap-profile-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 40px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.02em;
  text-transform: uppercase;
  margin-bottom: 6px;
}

.snap-tag {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 2px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 12px;
}

.snap-desc {
  font-size: 13px;
  line-height: 1.6;
  color: #555;
  margin-bottom: 14px;
  padding-left: 10px;
  border-left: 3px solid;
}

.snap-traits {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-bottom: 14px;
}

.snap-trait {
  background: #F5F5F0;
  border-radius: 3px;
  padding: 8px 10px;
}

.snap-trait-key {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #999;
  margin-bottom: 2px;
}

.snap-trait-val {
  font-size: 11px;
  font-weight: 600;
  color: #222;
}

.snap-bars .snap-bar-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}

.snap-bar-row:last-child { margin-bottom: 0; }

.snap-bar-lbl { font-size: 11px; color: #888; width: 150px; flex-shrink: 0; }
.snap-bar-track { flex: 1; height: 5px; background: #E8E8E4; border-radius: 99px; overflow: hidden; }
.snap-bar-fill { height: 100%; border-radius: 99px; }
.snap-bar-pct { font-size: 11px; color: #888; width: 28px; text-align: right; font-weight: 600; }

.snap-footer {
  margin-top: 14px;
  padding-top: 10px;
  border-top: 1px solid #e0e0da;
  font-size: 10px;
  color: #aaa;
  text-align: right;
  letter-spacing: 0.04em;
}

/* ── ACTIVITY MULTI-SELECT ── */
.activity-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
@media (max-width: 480px) { .activity-grid { grid-template-columns: repeat(2, 1fr); } }

.act-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 4px;
  cursor: pointer;
  font-family: 'Barlow', sans-serif;
  font-size: 13px;
  color: var(--text);
  text-align: left;
  transition: border-color 0.15s, background 0.15s;
  line-height: 1.3;
}
.act-btn:hover { border-color: var(--teal); background: #FAFAF8; }
.act-btn.selected { border-color: var(--teal); background: var(--teal-light); color: var(--teal-dark); }
.act-btn .act-check {
  flex-shrink: 0;
  width: 16px; height: 16px;
  border-radius: 3px;
  border: 1.5px solid var(--border);
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, border-color 0.15s;
}
.act-btn.selected .act-check { background: var(--teal); border-color: var(--teal); }
.act-check-tick { display: none; width: 8px; height: 8px; fill: white; }
.act-btn.selected .act-check-tick { display: block; }
.act-limit-note { font-size: 12px; color: var(--muted); margin-top: 10px; font-style: italic; }

/* ── PACKING STYLE CARDS ── */
.pack-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pack-card {
  padding: 20px 16px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  font-family: 'Barlow', sans-serif;
  text-align: center;
  transition: border-color 0.15s, background 0.15s;
}
.pack-card:hover { border-color: var(--teal); background: #FAFAF8; }
.pack-card.selected { border-color: var(--teal); background: var(--teal-light); }
.pack-icon { font-size: 28px; margin-bottom: 10px; line-height: 1; }
.pack-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.pack-desc { font-size: 12px; color: var(--muted); line-height: 1.5; }
.pack-card.selected .pack-title { color: var(--teal-dark); }
.pack-card.selected .pack-desc { color: var(--teal-dark); opacity: 0.8; }

/* copy toast */
.toast {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: #1A1A18;
  color: #fff;
  padding: 12px 24px;
  border-radius: 4px;
  font-size: 14px;
  font-weight: 500;
  transition: transform 0.3s ease;
  z-index: 100;
  pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="page">

<!-- ══════════════ WELCOME SCREEN ══════════════ -->
<section class="screen active" id="screen-welcome">
  <div class="welcome-inner">
    <div class="welcome-eyebrow">MSR · Cascade Designs</div>
    <h1 class="welcome-title">What kind of<br>outdoor user<br><span>are you?</span></h1>
    <p class="welcome-desc">17 questions. One profile. Discover which MSR user type matches how you actually live and gear up outdoors.</p>

    <div class="name-field-wrap">
      <label class="name-label" for="user-name">Your name</label>
      <input class="name-input" type="text" id="user-name" placeholder="First and last name" autocomplete="name" />
    </div>

    <button class="btn-start" id="btn-start" disabled>
      Start the quiz &rarr;
    </button>

    <p class="welcome-meta">Takes about 3 minutes &nbsp;·&nbsp; 15 questions</p>
  </div>
</section>

<!-- ══════════════ QUIZ SCREEN ══════════════ -->
<section class="screen" id="screen-quiz">
  <header class="topbar">
    <div class="logo">
      <span class="logo-badge">MSR</span>
      <span class="logo-text">User Profile Quiz</span>
    </div>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <span id="progress-label">0 / 17</span>
    </div>
  </header>

  <div class="quiz-body">
    <div class="question-wrap" id="question-wrap"></div>
  </div>

  <footer class="quiz-footer">
    <button class="btn-nav" id="btn-prev" disabled>← Back</button>
    <button class="btn-nav primary" id="btn-next" disabled>Next →</button>
  </footer>
</section>

<!-- ══════════════ RESULT SCREEN ══════════════ -->
<section class="screen" id="screen-result">
  <header class="topbar">
    <div class="logo">
      <span class="logo-badge">MSR</span>
      <span class="logo-text">User Profile Quiz</span>
    </div>

      const i = parseInt(btn.dataset.i);
      answers[current] = i;
      questionWrap.querySelectorAll('.opt').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      btnNext.disabled = false;
    });
  });

  questionWrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function renderActivitiesQuestion() {
  btnNext.disabled = selectedActivities.length < 1;
  questionWrap.innerHTML = `
    <div class="q-number">Question ${current + 1} of ${TOTAL_Q}</div>
    <div class="q-text">Which outdoor activities do you participate in most? Pick your top 4.</div>
    <div class="activity-grid">
      ${allActivities.map(a => `
        <button class="act-btn${selectedActivities.includes(a) ? ' selected' : ''}" data-act="${a}">
          <span class="act-check">
            <svg class="act-check-tick" viewBox="0 0 8 8"><polyline points="1,4 3,6.5 7,1.5" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          ${a}
        </button>
      `).join('')}
    </div>
    <div class="act-limit-note" id="act-note">
      ${selectedActivities.length}/4 selected${selectedActivities.length >= 4 ? ' — deselect one to change your choices' : ''}
    </div>
  `;

  questionWrap.querySelectorAll('.act-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const act = btn.dataset.act;
      if (selectedActivities.includes(act)) {
        selectedActivities = selectedActivities.filter(a => a !== act);
        btn.classList.remove('selected');
      } else {
        if (selectedActivities.length >= 4) return;
        selectedActivities.push(act);
        btn.classList.add('selected');
      }
      const note = document.getElementById('act-note');
      note.textContent = selectedActivities.length + '/4 selected' + (selectedActivities.length >= 4 ? ' — deselect one to change your choices' : '');
      btnNext.disabled = selectedActivities.length < 1;
    });
  });

  questionWrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function computeScores() {
  const s = { guide:0, athlete:0, enthusiast:0, generalist:0, novice:0 };
  answers.forEach((ansIdx, qi) => {
    if (ansIdx === null) return;
    const sc = questions[qi].opts[ansIdx].scores;
    for (const k in sc) s[k] += sc[k];
  });
  // Add packing style scores
  if (packingStyle) {
    const po = packingOpts.find(o => o.id === packingStyle);
    if (po) for (const k in po.scores) s[k] += po.scores[k];
  }
  // Add brand scores
  selectedBrands.forEach(name => {
    const b = allBrands.find(b => b.name === name);
    if (b) for (const k in b.scores) s[k] += b.scores[k];
  });
  return s;
}

function showResult() {
  const scores = computeScores();
  const maxKey = profileKeys.reduce((a,b) => scores[a] >= scores[b] ? a : b);
  const p = profiles[maxKey];
  const total = Object.values(scores).reduce((a,b) => a+b, 0) || 1;
  const now = new Date().toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });

  // Build dynamic traits: Top activities first, then profile traits
  const activitiesVal = selectedActivities.length > 0 ? selectedActivities.slice(0,3).join(', ') : '—';
  const packingVal = packingStyle ? packingOpts.find(o => o.id === packingStyle).title : '—';
  const brandsVal = selectedBrands.length > 0 ? selectedBrands.join(', ') : '—';
  const dynamicTraits = [
    { key: "Top activities", val: activitiesVal },
    { key: "Preferred brands", val: brandsVal },
    { key: "Camp style", val: packingVal },
    ...p.traits
  ];

  const traitsHtml = dynamicTraits.map(t => `
    <div class="trait-block">
      <div class="trait-key">${t.key}</div>
      <div class="trait-val">${t.val}</div>
    </div>
  `).join('');

  const scoreBarsHtml = profileKeys.map(k => {
    const pct = Math.round((scores[k]/total)*100);
    return `
      <div class="score-row">
        <span class="score-lbl">${profileLabels[k]}</span>
        <div class="score-track"><div class="score-fill" style="width:${pct}%; background:${profiles[k].barColor};"></div></div>
        <span class="score-pct">${pct}%</span>
      </div>
    `;
  }).join('');

  // Snapshot box (printable / copyable)
  const snapBarsHtml = profileKeys.map(k => {
    const pct = Math.round((scores[k]/total)*100);
    return `
      <div class="snap-bar-row">
        <span class="snap-bar-lbl">${profileLabels[k]}</span>
        <div class="snap-bar-track"><div class="snap-bar-fill" style="width:${pct}%; background:${profiles[k].barColor};"></div></div>
        <span class="snap-bar-pct">${pct}%</span>
      </div>
    `;
  }).join('');

  const snapTraitsHtml = dynamicTraits.map(t => `
    <div class="snap-trait">
      <div class="snap-trait-key">${t.key}</div>
      <div class="snap-trait-val">${t.val}</div>
    </div>
  `).join('');

  const resultCard = document.getElementById('result-card');
  resultCard.innerHTML = `
    <div class="result-hero">
      <div class="result-eyebrow" style="color:${p.color}">Your MSR User Profile</div>
      <div class="result-name-line">${userName}</div>
      <div class="result-title" style="color:${p.color}">${p.name}</div>
      <div class="result-subtitle-tag" style="background:${p.badgeBg}; color:${p.badgeText};">${p.subtitle}</div>
    </div>

    <div class="result-divider" style="--bar:${p.color}">
      <div style="position:absolute;left:0;top:0;height:100%;width:80px;background:${p.color};border-radius:2px;"></div>
    </div>

    <p class="result-desc" style="border-color:${p.color};">${p.desc}</p>

    <div class="traits-grid">${traitsHtml}</div>

    <div class="score-section">
      <div class="score-heading">Score breakdown — all profiles</div>
      ${scoreBarsHtml}
    </div>

    <div class="snapshot-wrap">
      <span class="snapshot-label">Shareable snapshot</span>
      <div id="snapshot-box">
        <div class="snap-header">
          <div>
            <div class="snap-logo"><span>MSR</span>User Profile Quiz</div>
          </div>
          <div class="snap-meta">${now}</div>
        </div>
        <div class="snap-name">${userName}</div>
        <div class="snap-profile-name" style="color:${p.color};">${p.name}</div>
        <div class="snap-tag" style="background:${p.badgeBg}; color:${p.badgeText};">${p.subtitle}</div>
        <p class="snap-desc" style="border-color:${p.color};">${p.desc}</p>
        <div class="snap-traits">${snapTraitsHtml}</div>
        <div class="snap-bars">${snapBarsHtml}</div>
        <div class="snap-footer">MSR · Cascade Designs &nbsp;·&nbsp; User Research</div>
      </div>
    </div>

    <div class="result-actions">
      <button class="btn-action primary" id="btn-copy-snapshot">Download snapshot PNG</button>
      <button class="btn-action" id="btn-print">Print / Save PDF</button>
    </div>
  `;

  showScreen('screen-result');

  document.getElementById('btn-copy-snapshot').addEventListener('click', downloadSnapshotPNG);
  document.getElementById('btn-print').addEventListener('click', () => window.print());
  document.getElementById('btn-retake').addEventListener('click', () => {
    current = 0;
    answers = new Array(questions.length).fill(null);
    selectedActivities = [];
    packingStyle = null;
    selectedBrands = [];
    showScreen('screen-welcome');
  });
}

function downloadSnapshotPNG() {
  const btn = document.getElementById('btn-copy-snapshot');
  const box = document.getElementById('snapshot-box');
  btn.textContent = 'Generating…';
  btn.disabled = true;

  // Temporarily boost snapshot box for high-res capture
  const origStyle = box.getAttribute('style') || '';
  box.style.width = '680px';
  box.style.padding = '28px';

  html2canvas(box, {
    scale: 2,
    useCORS: true,
    backgroundColor: '#ffffff',
    logging: false,
    onclone: (doc) => {
      // Ensure fonts load in the cloned doc
      const el = doc.getElementById('snapshot-box');
      if (el) {
        el.style.fontFamily = "'Barlow', sans-serif";
      }
    }
  }).then(canvas => {
    box.setAttribute('style', origStyle);
    const safeName = userName.replace(/\s+/g, '_') || 'result';
    const link = document.createElement('a');
    link.download = `MSR_Profile_${safeName}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    btn.textContent = 'Download snapshot PNG';
    btn.disabled = false;
    showToast('PNG downloaded!');
  }).catch(() => {
    box.setAttribute('style', origStyle);
    btn.textContent = 'Download snapshot PNG';
    btn.disabled = false;
    showToast('Download failed — try Print / Save PDF instead.');
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

// Print styles
const printStyle = document.createElement('style');
printStyle.textContent = `
  @media print {
    .topbar, .result-actions, .snapshot-label, .snapshot-wrap { display: none !important; }
    .result-hero, .result-desc, .traits-grid, .score-section { display: block !important; }
    #snapshot-box { border: 1px solid #ccc !important; }
    body { background: #fff !important; }
  }
`;
document.head.appendChild(printStyle);
</script>
